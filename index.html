<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Breaker System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: #e2e8f0;
        }

        .vault-container {
            background: linear-gradient(145deg, #23233a, #161625);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(79, 70, 229, 0.1);
            width: 100%;
            max-width: 500px;
            border: 1px solid #2d2d44;
            position: relative;
            overflow: hidden;
        }

        .vault-door-outer {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 8px solid #334155;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #1e293b;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vault-handle {
            width: 70%;
            height: 10px;
            background: #64748b;
            border-radius: 5px;
            position: absolute;
            transition: transform 0.8s ease;
        }

        .vault-handle::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 70px;
            background: #64748b;
            top: -30px;
            left: 50%;
            margin-left: -5px;
            border-radius: 5px;
        }

        /* Status Colors */
        .status-locked .vault-door-outer { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .status-layer-1 .vault-door-outer { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
        .status-unlocked .vault-door-outer { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
        .status-unlocked .vault-handle { transform: rotate(180deg); background: #10b981; }

        .key-slot {
            background: #0f172a;
            border: 1px solid #334155;
            color: #38bdf8;
            font-size: 1.25rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .key-slot:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            background: #1e293b;
        }

        .key-slot.error {
            border-color: #ef4444;
            color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
            background: #2d1a1a;
        }

        .key-slot.success {
            border-color: #10b981;
            color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
            background: #1a2d1a;
        }

        .hidden { display: none; }

        .layer-transition-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .layer-transition-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(56, 189, 248, 0.1);
            opacity: 0.5;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .progress-bar-inner {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 1.5s ease-in-out;
        }

        .secret-content {
            border: 2px dashed #10b981;
            padding: 1.5rem;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 1rem;
        }
    </style>
</head>
<body>

    <div class="vault-container" id="vault-interface">
        <div class="scanline"></div>
        
        <!-- Transition Screen -->
        <div id="transition-overlay" class="layer-transition-overlay">
            <div id="transition-text" class="text-sky-400 font-bold mb-4 animate-pulse">DECRYPTING LAYER 01...</div>
            <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                <div id="progress-bar" class="progress-bar-inner"></div>
            </div>
            <div id="transition-subtext" class="text-[10px] text-slate-500 mt-2 text-center">INITIALIZING LAYER 02 PROTOCOLS</div>
        </div>

        <!-- Vault Header/Visual -->
        <div id="door-status" class="status-locked">
            <div class="vault-door-outer">
                <div class="vault-handle"></div>
            </div>
        </div>

        <!-- Home Page (Grade Selection) -->
        <div id="home-page" class="text-center">
            <h1 class="text-2xl font-bold text-sky-400 mb-2 uppercase tracking-widest">Vault Access</h1>
            <p class="text-slate-400 text-sm mb-6 uppercase">Enter Operative Designation</p>
            
            <input type="text" id="operative-name" class="w-full p-3 mb-6 bg-slate-800 border border-slate-600 rounded-lg text-center focus:border-sky-400 outline-none transition" placeholder="ENTER YOUR NAME">

            <div class="grid grid-cols-1 gap-4">
                <button onclick="startBypass(6)" class="group relative py-4 bg-slate-800 border border-slate-600 rounded-lg overflow-hidden transition hover:bg-slate-700">
                    <span class="relative z-10 font-bold tracking-widest">SECURITY CLEARANCE GRADE 06</span>
                    <div class="absolute inset-0 bg-indigo-500/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                </button>
                <button onclick="startBypass(7)" class="group relative py-4 bg-slate-800 border border-slate-600 rounded-lg overflow-hidden transition hover:bg-slate-700">
                    <span class="relative z-10 font-bold tracking-widest">SECURITY CLEARANCE GRADE 07</span>
                    <div class="absolute inset-0 bg-emerald-500/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                </button>
            </div>
        </div>

        <!-- Entry Page (Key Bypass) -->
        <div id="entry-page" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <button onclick="goHome()" class="text-xs text-slate-500 hover:text-sky-400 transition">
                    &lt; TERMINATE_SESSION
                </button>
                <div class="flex flex-col items-end">
                    <span id="level-indicator" class="text-[10px] px-2 py-1 bg-slate-800 rounded border border-slate-700 text-sky-400 font-bold mb-1"></span>
                    <span id="layer-indicator" class="text-[10px] text-slate-500 font-bold">SECURITY_LAYER: 01</span>
                </div>
            </div>

            <h2 id="bypass-text" class="text-sm font-bold text-slate-200 mb-6 text-center uppercase tracking-widest">Primary Bypass Sequence</h2>

            <div class="grid grid-cols-2 gap-4" id="slots-container">
                <div>
                    <label id="label-1" class="block text-[10px] text-slate-500 mb-1 uppercase">Key 1</label>
                    <input type="number" id="key-1" class="key-slot w-full p-3 rounded-md" placeholder="00" oninput="this.classList.remove('error', 'success')">
                </div>
                <div>
                    <label id="label-2" class="block text-[10px] text-slate-500 mb-1 uppercase">Key 2</label>
                    <input type="number" id="key-2" class="key-slot w-full p-3 rounded-md" placeholder="00" oninput="this.classList.remove('error', 'success')">
                </div>
                <div>
                    <label id="label-3" class="block text-[10px] text-slate-500 mb-1 uppercase">Key 3</label>
                    <input type="number" id="key-3" class="key-slot w-full p-3 rounded-md" placeholder="00" oninput="this.classList.remove('error', 'success')">
                </div>
                <div>
                    <label id="label-4" class="block text-[10px] text-slate-500 mb-1 uppercase">Key 4</label>
                    <input type="number" id="key-4" class="key-slot w-full p-3 rounded-md" placeholder="00" oninput="this.classList.remove('error', 'success')">
                </div>
            </div>

            <button id="submit-btn" onclick="validateKeys()" class="w-full mt-8 py-4 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg shadow-lg shadow-sky-900/20 transition-all active:scale-95">
                EXECUTE OVERRIDE
            </button>

            <div id="feedback" class="mt-6 p-4 rounded-md text-sm text-center border hidden font-bold"></div>
        </div>

        <!-- Success Terminal -->
        <div id="success-page" class="hidden text-center">
            <h2 class="text-emerald-400 font-bold text-xl mb-4 tracking-tighter animate-pulse">SYSTEM COMPROMISED</h2>
            <div class="secret-content mb-6">
                <p class="text-[10px] text-slate-500 uppercase mb-2">Decrypted Passphrase:</p>
                <p id="final-phrase" class="text-emerald-300 font-bold text-lg leading-tight italic"></p>
            </div>
            <button onclick="goHome()" class="text-xs py-2 px-4 bg-slate-800 rounded border border-slate-700 hover:bg-slate-700 transition">
                CLOSE CONNECTION
            </button>
        </div>
    </div>

    <script>
        let currentGrade = null;
        let currentLayer = 1;
        let operativeName = "OPERATIVE";

        const verbs = ["rides", "chases", "paints", "whispers to", "studies", "guards", "befriends", "hides", "follows", "leads", "observes", "scans", "decodes", "juggles", "distracts", "rescues", "animates", "imagines", "builds", "tames", "flies with", "puzzles over", "unlocks", "commands", "captures", "protects", "fights", "dances with", "escapes", "detects", "mimics", "carries", "signals", "notices", "watches", "tracks", "hears", "finds"];
        const colors = ["crimson", "neon blue", "emerald", "midnight", "golden", "obsidian", "violet", "silver", "electric lime", "sapphire", "ruby", "jade", "amber", "onyx", "azure", "quartz", "cyber-pink", "plasma", "metallic", "translucent", "shadow", "lava", "glitch-green", "solar", "lunar", "toxic", "phantom", "cobalt", "tangerine", "turquoise"];
        const animals = ["falcon", "panther", "owl", "wolf", "cobra", "dragon", "octopus", "eagle", "tiger", "lynx", "raven", "shark", "bear", "fox", "stag", "phoenix", "mantis", "beetle", "kraken", "viper", "cheetah", "elephant", "orca", "bat", "hawk", "lion", "rhino", "dolphin", "turtle", "wasp"];

        const vaultKeys = {
            6: {
                layer1: [3, 4, 53, 56],
                layer2: [13, 36, 108, 216]
            },
            7: {
                layer1: [9, 56, 8, 104],
                layer2: [24, 16, 2652, 1380]
            }
        };

        function startBypass(grade) {
            const nameInput = document.getElementById('operative-name').value;
            operativeName = (nameInput.trim() || "UNKNOWN OPERATIVE").toUpperCase();
            showEntryPage(grade);
        }

        function showEntryPage(grade) {
            currentGrade = grade;
            currentLayer = 1;
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('success-page').classList.add('hidden');
            document.getElementById('entry-page').classList.remove('hidden');
            document.getElementById('level-indicator').innerText = `CLEARANCE_GRADE_0${grade}`;
            updateLayerUI();
            clearInputs();
        }

        function updateLayerUI() {
            const layerIndicator = document.getElementById('layer-indicator');
            const bypassText = document.getElementById('bypass-text');
            const submitBtn = document.getElementById('submit-btn');
            
            if (currentLayer === 1) {
                layerIndicator.innerText = "SECURITY_LAYER: 01";
                bypassText.innerText = "Primary Bypass Sequence";
                submitBtn.innerText = "EXECUTE OVERRIDE";
                for(let i=1; i<=4; i++) document.getElementById(`label-${i}`).innerText = `Key ${i}`;
            } else {
                layerIndicator.innerText = "SECURITY_LAYER: 02";
                bypassText.innerText = "Final Bypass Sequence";
                submitBtn.innerText = "FINAL AUTHORIZATION";
                for(let i=1; i<=4; i++) document.getElementById(`label-${i}`).innerText = `Key ${i + 4}`;
            }
        }

        function goHome() {
            document.getElementById('entry-page').classList.add('hidden');
            document.getElementById('success-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('door-status').className = 'status-locked';
            currentGrade = null;
            currentLayer = 1;
            hideFeedback();
        }

        function clearInputs() {
            for(let i = 1; i <= 4; i++) {
                const el = document.getElementById(`key-${i}`);
                el.value = '';
                el.classList.remove('error', 'success');
            }
        }

        function hideFeedback() {
            const feedback = document.getElementById('feedback');
            feedback.classList.add('hidden');
        }

        async function validateKeys() {
            const gradeData = vaultKeys[currentGrade];
            const targetKeys = currentLayer === 1 ? gradeData.layer1 : gradeData.layer2;
            
            const feedback = document.getElementById('feedback');
            const door = document.getElementById('door-status');
            const container = document.getElementById('vault-interface');
            
            let allCorrect = true;
            let anyEmpty = false;

            for (let i = 1; i <= 4; i++) {
                const input = document.getElementById(`key-${i}`);
                const val = parseInt(input.value);
                input.classList.remove('error', 'success');

                if (isNaN(val)) {
                    anyEmpty = true;
                    allCorrect = false;
                } else if (val === targetKeys[i-1]) {
                    input.classList.add('success');
                } else {
                    input.classList.add('error');
                    allCorrect = false;
                }
            }
            
            if (anyEmpty) {
                showFeedback('INCOMPLETE DATA: ALL KEYS REQUIRED', 'border-yellow-900/50 bg-yellow-900/20 text-yellow-500');
                return;
            }

            if (allCorrect) {
                if (currentLayer === 1) {
                    door.className = 'status-layer-1';
                    showFeedback('LAYER 01 BYPASSED. STANDBY...', 'border-sky-900/50 bg-sky-900/20 text-sky-400');
                    setTimeout(() => runTransition(2), 1000);
                } else {
                    door.className = 'status-unlocked';
                    showFeedback('FINAL SECURITY BYPASSED', 'border-emerald-900/50 bg-emerald-900/20 text-emerald-400');
                    setTimeout(() => runTransition(3), 1000);
                }
            } else {
                door.className = 'status-locked';
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);
                showFeedback('ACCESS DENIED: KEY MISMATCH DETECTED', 'border-red-900/50 bg-red-900/20 text-red-400');
            }
        }

        function generateSecretPhrase() {
            const verb = verbs[Math.floor(Math.random() * verbs.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const animal = animals[Math.floor(Math.random() * animals.length)];
            const phrase = `${operativeName} ${verb} the ${color} ${animal}`;
            return phrase.toUpperCase();
        }

        function runTransition(targetStage) {
            const overlay = document.getElementById('transition-overlay');
            const bar = document.getElementById('progress-bar');
            const mainText = document.getElementById('transition-text');
            const subText = document.getElementById('transition-subtext');
            
            if (targetStage === 3) {
                mainText.innerText = "FINAL DECRYPT IN PROGRESS...";
                subText.innerText = "RECOVERING CORE DATA ASSETS";
            } else {
                mainText.innerText = "DECRYPTING LAYER 01...";
                subText.innerText = "INITIALIZING LAYER 02 PROTOCOLS";
            }

            overlay.classList.add('active');
            setTimeout(() => bar.style.width = '100%', 100);

            setTimeout(() => {
                overlay.classList.remove('active');
                bar.style.width = '0%';
                
                if (targetStage === 2) {
                    currentLayer = 2;
                    updateLayerUI();
                    clearInputs();
                    hideFeedback();
                } else {
                    showFinalSuccess();
                }
            }, 2000);
        }

        function showFinalSuccess() {
            document.getElementById('entry-page').classList.add('hidden');
            document.getElementById('success-page').classList.remove('hidden');
            document.getElementById('final-phrase').innerText = generateSecretPhrase();
        }

        function showFeedback(message, classes) {
            const feedback = document.getElementById('feedback');
            feedback.innerText = message;
            feedback.className = `mt-6 p-4 rounded-md text-sm text-center border font-bold ${classes}`;
            feedback.classList.remove('hidden');
        }
    </script>
</body>
</html>
