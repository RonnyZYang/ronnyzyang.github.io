<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crack the Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 1.5rem;
    }

    p {
      text-align: center;
      font-size: 0.95rem;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    input[type="number"] {
      width: 100%;
      padding: 6px;
      text-align: center;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      background: #007bff;
      color: #ffffff;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      color: #b00020;
      text-align: center;
      min-height: 1.2em;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Crack the Code</h1>
    <p>Enter the correct 10-number code to unlock the message.</p>

    <form id="codeForm">
      <div class="inputs">
        <input type="number" id="code1" required />
        <input type="number" id="code2" required />
        <input type="number" id="code3" required />
        <input type="number" id="code4" required />
        <input type="number" id="code5" required />
        <input type="number" id="code6" required />
        <input type="number" id="code7" required />
        <input type="number" id="code8" required />
        <input type="number" id="code9" required />
        <input type="number" id="code10" required />
      </div>

      <div class="error" id="errorMsg"></div>

      <button type="submit">Unlock</button>
    </form>
  </div>

  <script>
    const correctCode = [6, 10, 3, 2, 8, 6, 44, 15, 47, 49];

    document.getElementById('codeForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const userInputs = [];
      for (let i = 1; i <= 10; i++) {
        const value = document.getElementById('code' + i).value.trim();
        userInputs.push(Number(value));
      }

      let allCorrect = true;
      for (let i = 0; i < correctCode.length; i++) {
        if (userInputs[i] !== correctCode[i]) {
          allCorrect = false;
          break;
        }
      }

      if (allCorrect) {
        window.location.href = 'success.html';
      } else {
        errorMsg.textContent = 'Incorrect code. Try again!';
      }
    });
  </script>
</body>
</html>
