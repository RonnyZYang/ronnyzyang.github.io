<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(45deg, #ff6b6b, #ffb6b9, #8ec5fc, #e0c3fc, #ff9a9e, #fad0c4, #ffdde1);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite, moveBackground 10s linear infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
            flex-direction: column;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes moveBackground {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .scoreboard {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            width: 60%;
            max-width: 600px;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite alternate;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .scores {
            display: flex;
            justify-content: space-around;
            font-size: 26px;
            position: relative;
        }
        .player {
            font-weight: bold;
            position: relative;
        }
        .score {
            font-size: 50px;
            margin-top: 10px;
            color: #ff4f4f;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        .moving-button {
            position: absolute;
            padding: 10px 20px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            animation: moveAround 3s infinite alternate ease-in-out;
        }
        @keyframes moveAround {
            0% { top: 10%; left: 10%; }
            25% { top: 10%; left: 80%; }
            50% { top: 80%; left: 80%; }
            75% { top: 80%; left: 10%; }
            100% { top: 10%; left: 10%; }
        }
        .message {
            display: none;
            font-size: 60px;
            font-weight: bold;
            color: black;
            margin-top: 20px;
            text-transform: uppercase;
            animation: flash 1s infinite alternate;
        }
        @keyframes flash {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
    <script>
        function changeBackground() {
            const colors = [
                ['#ff6b6b', '#ffb6b9', '#8ec5fc', '#e0c3fc'],
                ['#ff9a9e', '#fad0c4', '#ffdde1', '#8ec5fc'],
                ['#74ebd5', '#acb6e5', '#ff9a9e', '#fad0c4'],
                ['#ff9966', '#ff5e62', '#ffb6b9', '#e0c3fc']
            ];
            const randomGradient = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = `linear-gradient(45deg, ${randomGradient.join(', ')})`;
        }
        document.addEventListener('click', changeBackground);
        
        function explodeScoreboard() {
            const scoreboard = document.querySelector('.scoreboard');
            const button = document.querySelector('.moving-button');
            const message = document.querySelector('.message');
            
            scoreboard.style.transform = 'scale(2) rotate(20deg)';
            scoreboard.style.opacity = '0';
            button.style.display = 'none';
            
            setTimeout(() => {
                scoreboard.style.display = 'none';
                message.style.display = 'block';
            }, 500);
        }
    </script>
</head>
<body>
    <div class="scoreboard">
        <div class="scores">
            <div>
                <div class="player">Mr. Yang</div>
                <div class="score" id="score1">3</div>
            </div>
            <div>
                <div class="player">Aarush</div>
                <div class="score" id="score2">3</div>
            </div>
        </div>
    </div>
    <button class="moving-button" onclick="explodeScoreboard()">Don't touch me</button>
    <div class="message">LOOK WHAT YOU DID!</div>
</body>
</html>
