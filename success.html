<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Cracked</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .message-box {
      text-align: center;
      padding: 30px 40px;
      border-radius: 12px;
      background: #1f2937;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      max-width: 500px;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>Code Cracked!</h1>
    <p>Tell Mr.Yang <strong>"The Sparrow Falls"</strong></p>
  </div>
</body>
</html>
